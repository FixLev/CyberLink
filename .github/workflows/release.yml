name: Release CyberLink

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Ручной запуск

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create release package
      run: |
        mkdir cyberlink_release
        cp -r core/ gui/ main.py run.py updater.py mobile_adapter.py version.txt requirements.txt README.md LICENSE cyberlink_release/
        cd cyberlink_release
        zip -r ../cyberlink-${{ github.ref_name }}.zip .
        cd ..
        tar -czf cyberlink-${{ github.ref_name }}.tar.gz cyberlink_release/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          cyberlink-*.zip
          cyberlink-*.tar.gz
        draft: false
        prerelease: false
        body: |
          # 🚀 CyberLink ${{ github.ref_name }}
          
          ## 📦 Что нового
          - Автообновление через GitHub
          - Поддержка мобильных устройств
          - Улучшенный интерфейс
          - Исправление багов
          
          ## 📥 Установка
          ### Быстрая установка
          ```bash
          git clone https://github.com/cyberlink/cyberlink.git
          cd cyberlink
          python run.py